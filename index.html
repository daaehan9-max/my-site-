<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 웹 문서 에디터</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Pretendard:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --a4-width: 794px;
            --a4-height: 1123px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif !important;
            background-color: #eef2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .control-panel {
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            max-width: 800px;
            width: 100%;
        }

        .control-panel button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn-add-text { background-color: #4f46e5; color: white; }
        .btn-add-text:hover { background-color: #4338ca; }

        .btn-add-img { background-color: #059669; color: white; }
        .btn-add-img:hover { background-color: #047857; }

        .btn-print { background-color: #475569; color: white; }
        .btn-print:hover { background-color: #334155; }

        .document-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
            padding-bottom: 50px;
        }

        .a4-page {
            width: var(--a4-width);
            height: var(--a4-height);
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 60px 70px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }

        .page-content {
            display: flex;
            flex-direction: column;
            gap: 18px;
            flex-grow: 1;
            height: calc(var(--a4-height) - 170px);
            overflow: hidden;
        }

        .page-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            height: 40px;
            font-size: 14px;
            color: #64748b;
        }

        .nav-btn {
            background: none;
            border: 1px solid #cbd5e1;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: #475569;
            transition: background 0.2s;
        }
        .nav-btn:hover:not(:disabled) {
            background: #f1f5f9;
            color: #0f172a;
        }
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .item-box {
            position: relative;
            width: 100%;
        }
        .item-box:hover .delete-btn {
            opacity: 1;
        }

        /* 글 정렬 및 명조체 깔끔하게 다듬기 */
        .text-item {
            font-family: 'Noto Serif KR', serif !important;
            font-size: 16px;
            line-height: 1.9;
            color: #1e293b;
            outline: none;
            padding: 8px 4px;
            border: 1px dashed transparent;
            text-align: justify; /* 양쪽 정렬로 줄바꿈 라인 맞춤 */
            word-break: break-all;
            white-space: pre-wrap;
        }
        .text-item:focus {
            border-color: #cbd5e1;
            background: #fafafa;
            border-radius: 4px;
        }

        /* 그림 정렬 및 박스 레이아웃 */
        .image-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            max-height: 320px;
            overflow: hidden;
            width: 100%;
        }
        .image-item img {
            max-width: 100%;
            max-height: 290px;
            object-fit: contain;
            border-radius: 4px;
        }

        .delete-btn {
            position: absolute;
            top: -4px;
            right: -4px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 11px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .delete-btn:hover {
            background: rgb(220, 38, 38);
        }

        @media print {
            body { background: none; padding: 0; }
            .control-panel { display: none; }
            .document-container { gap: 0; }
            .a4-page { box-shadow: none; margin: 0; page-break-after: always; }
            .delete-btn { display: none !important; }
            .text-item { border: none !important; background: transparent !important; }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <button class="btn-add-text" onclick="addItem('text')">＋ 글 추가</button>
        <button class="btn-add-img" onclick="addItem('image')">＋ 그림 추가</button>
        <button class="btn-print" onclick="window.print()">🖨 인쇄 / PDF 저장</button>
    </div>

    <div id="documentContainer" class="document-container"></div>

    <script>
        let items = JSON.parse(localStorage.getItem('a4_doc_items')) || [
            { type: 'text', content: '여기에 정렬이 깔끔하게 맞는 글을 작성해보세요. 좌우 간격과 여백이 반듯하게 정돈되어 출력됩니다.' }
        ];

        function renderDocument() {
            const container = document.getElementById('documentContainer');
            container.innerHTML = '';

            if (items.length === 0) {
                container.appendChild(createPageElement(1, 1, []));
                saveData();
                return;
            }

            let pagesItems = distributeItemsIntoPages();
            let totalPages = pagesItems.length;

            pagesItems.forEach((pageItems, index) => {
                let pageNum = index + 1;
                let pageEl = createPageElement(pageNum, totalPages, pageItems);
                container.appendChild(pageEl);
            });

            saveData();
        }

        function distributeItemsIntoPages() {
            let measurePage = document.createElement('div');
            measurePage.className = 'a4-page';
            measurePage.style.position = 'absolute';
            measurePage.style.visibility = 'hidden';
            measurePage.style.top = '-9999px';
            document.body.appendChild(measurePage);

            let contentArea = document.createElement('div');
            contentArea.className = 'page-content';
            measurePage.appendChild(contentArea);

            const MAX_CONTENT_HEIGHT = 850; 

            let pages = [];
            let currentPageItems = [];
            let currentHeight = 0;

            items.forEach((item, index) => {
                let itemEl = createItemElement(item, index);
                contentArea.appendChild(itemEl);
                
                let itemHeight = itemEl.offsetHeight + 18;

                if (currentHeight + itemHeight > MAX_CONTENT_HEIGHT && currentPageItems.length > 0) {
                    pages.push(currentPageItems);
                    currentPageItems = [item];
                    contentArea.innerHTML = '';
                    contentArea.appendChild(itemEl);
                    currentHeight = itemEl.offsetHeight + 18;
                } else {
                    currentPageItems.push(item);
                    currentHeight += itemHeight;
                }
            });

            if (currentPageItems.length > 0) {
                pages.push(currentPageItems);
            }

            document.body.removeChild(measurePage);
            return pages;
        }

        function createPageElement(pageNum, totalPages, pageItems) {
            let pageDiv = document.createElement('div');
            pageDiv.className = 'a4-page';

            let contentDiv = document.createElement('div');
            contentDiv.className = 'page-content';
            pageDiv.appendChild(contentDiv);

            pageItems.forEach(item => {
                let originalIndex = items.indexOf(item);
                let itemEl = createItemElement(item, originalIndex);
                contentDiv.appendChild(itemEl);
            });

            let footerDiv = document.createElement('div');
            footerDiv.className = 'page-footer';
            
            let prevBtn = document.createElement('button');
            prevBtn.className = 'nav-btn';
            prevBtn.innerHTML = '‹ 이전';
            prevBtn.disabled = pageNum === 1;
            prevBtn.onclick = () => scrollToPage(pageNum - 1);

            let pageIndicator = document.createElement('span');
            pageIndicator.innerHTML = `${pageNum} / ${totalPages}`;

            let nextBtn = document.createElement('button');
            nextBtn.className = 'nav-btn';
            nextBtn.innerHTML = '다음 ›';
            nextBtn.disabled = pageNum === totalPages;
            nextBtn.onclick = () => scrollToPage(pageNum + 1);

            footerDiv.appendChild(prevBtn);
            footerDiv.appendChild(pageIndicator);
            footerDiv.appendChild(nextBtn);

            pageDiv.appendChild(footerDiv);
            return pageDiv;
        }

        function createItemElement(item, index) {
            let wrapper = document.createElement('div');
            wrapper.className = 'item-box';

            let delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '✕';
            delBtn.title = '삭제';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                deleteItem(index);
            };
            wrapper.appendChild(delBtn);

            if (item.type === 'text') {
                let textDiv = document.createElement('div');
                textDiv.className = 'text-item';
                textDiv.contentEditable = true;
                textDiv.innerText = item.content;
                
                textDiv.oninput = (e) => {
                    items[index].content = e.target.innerText;
                    renderDocument();
                };
                wrapper.appendChild(textDiv);
            } else if (item.type === 'image') {
                let imgDiv = document.createElement('div');
                imgDiv.className = 'image-item';

                if (item.content) {
                    let img = document.createElement('img');
                    img.src = item.content;
                    imgDiv.appendChild(img);
                } else {
                    let fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.accept = 'image/*';
                    fileInput.onchange = (e) => {
                        let file = e.target.files[0];
                        if (file) {
                            let reader = new FileReader();
                            reader.onload = (uploadEvent) => {
                                items[index].content = uploadEvent.target.result;
                                renderDocument();
                            };
                            reader.readAsDataURL(file);
                        }
                    };
                    imgDiv.appendChild(fileInput);
                }
                wrapper.appendChild(imgDiv);
            }

            return wrapper;
        }

        function addItem(type) {
            items.push({
                type: type,
                content: type === 'text' ? '새로운 내용을 입력하세요...' : ''
            });
            renderDocument();
        }

        function deleteItem(index) {
            items.splice(index, 1);
            renderDocument();
        }

        function scrollToPage(pageNum) {
            const pages = document.querySelectorAll('.a4-page');
            if (pages[pageNum - 1]) {
                pages[pageNum - 1].scrollIntoView({ behavior: 'smooth' });
            }
        }

        function saveData() {
            localStorage.setItem('a4_doc_items', JSON.stringify(items));
        }

        window.onload = () => {
            renderDocument();
        };
    </script>
</body>
</html>
