<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PairMaker</title>
    <!-- 폰트 로드 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2c2c2c;
            font-family: 'Pretendard', sans-serif;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px 80px 10px;
            overflow-x: hidden;
        }

        /* 상단 컨트롤 패널 */
        .control-panel {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-panel button {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            background-color: #f9fafb;
            color: #374151;
            transition: all 0.2s;
        }
        .control-panel button:hover { background-color: #e5e7eb; color: #111; }
        .control-panel button:disabled { opacity: 0.4; cursor: not-allowed; }

        .page-indicator {
            font-weight: 700;
            font-size: 14px;
            color: #111;
            min-width: 45px;
            text-align: center;
        }

        .btn-primary { background-color: #111 !important; color: #fff !important; border-color: #111 !important; }
        .btn-primary:hover { background-color: #333 !important; }
        .btn-danger { color: #dc2626 !important; border-color: #fca5a5 !important; }
        .btn-danger:hover { background-color: #fee2e2 !important; }

        /* A4 문서 레이아웃 */
        .document-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

            width: 794px;
            height: 1123px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            padding: 60px 70px;
            display: none;
