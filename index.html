<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A4 문서 편집기</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #dedede;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;
}

/* =========================
   상단 도구
========================= */

.toolbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    width: 100%;

    padding: 10px;

    background: rgba(255,255,255,0.97);

    border-bottom: 1px solid #ccc;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 7px;

    flex-wrap: wrap;
}

.toolbar button {
    appearance: none;

    border: 1px solid #aaa;

    background: #fff;

    color: #222;

    border-radius: 7px;

    padding: 8px 12px;

    font-size: 13px;

    cursor: pointer;
}

.toolbar button:active {
    transform: scale(0.98);
}

.page-number {
    min-width: 55px;

    text-align: center;

    font-size: 13px;

    color: #555;
}

/* =========================
   A4 바깥 영역
========================= */

.page-area {
    width: 100%;

    display: flex;

    justify-content: center;

    padding: 30px 10px 80px;

    overflow: hidden;
}

/* =========================
   ★ 진짜 A4
========================= */

.a4-page {
    width: 210mm;
    height: 297mm;

    min-width: 210mm;
    min-height: 297mm;

    background: white;

    padding: 17mm 18mm;

    position: relative;

    display: none;

    flex-direction: column;

    overflow: hidden;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.18);
}

.a4-page.active {
    display: flex;
}

/* =========================
   이미지
========================= */

.image-box {
    width: 100%;

    height: 48mm;

    flex-shrink: 0;

    border: 1.5px dashed #aaa;

    background: #fafafa;

    border-radius: 4px;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    cursor: pointer;

    margin-bottom: 6mm;
}

.image-box:hover {
    background: #f3f3f3;
}

.image-box span {
    color: #999;

    font-size: 13px;
}

.image-box img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* =========================
   작가
========================= */

.author {
    flex-shrink: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    font-size: 10pt;

    color: #888;

    margin-bottom: 3mm;

    outline: none;
}

/* =========================
   제목
========================= */

.title {
    flex-shrink: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    font-size: 21pt;

    font-weight: 700;

    line-height: 1.35;

    margin-bottom: 2mm;

    outline: none;
}

/* =========================
   부제목
========================= */

.subtitle {
    flex-shrink: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    font-size: 12pt;

    color: #777;

    line-height: 1.5;

    margin-bottom: 6mm;

    outline: none;
}

/* =========================
   본문
========================= */

.content {
    flex: 1;

    min-height: 0;

    font-family:
        "Batang",
        "AppleMyungjo",
        "Gowun Batang",
        serif;

    font-size: 12pt;

    line-height: 1.85;

    color: #222;

    white-space: pre-wrap;

    word-break: break-word;

    outline: none;

    overflow: hidden;
}

[contenteditable="true"]:focus {
    outline: none;
}

/* =========================
   모바일
========================= */

@media screen and (max-width: 850px) {

    .page-area {
        padding-top: 20px;
        padding-bottom: 60px;
    }

}

/* =========================
   PDF / 인쇄
========================= */

@page {
    size: A4;
    margin: 0;
}

@media print {

    html,
    body {
        margin: 0 !important;
        padding: 0 !important;

        background: white !important;
    }

    .toolbar {
        display: none !important;
    }

    .page-area {
        display: block !important;

        padding: 0 !important;

        margin: 0 !important;
    }

    .a4-page {
        display: flex !important;

        width: 210mm !important;
        height: 297mm !important;

        min-width: 210mm !important;
        min-height: 297mm !important;

        margin: 0 !important;

        padding: 17mm 18mm !important;

        box-shadow: none !important;

        page-break-after: always;

        break-after: page;

        overflow: hidden !important;
    }

    .a4-page:last-child {
        page-break-after: auto;

        break-after: auto;
    }
}
</style>
</head>


<body>


<!-- =========================
     도구 버튼
========================= -->

<div class="toolbar">

    <button onclick="previousPage()">
        ‹ 이전
    </button>

    <span
        id="pageNumber"
        class="page-number">
        1 / 1
    </span>

    <button onclick="nextPage()">
        다음 ›
    </button>

    <button onclick="addPage()">
        ＋ 페이지 추가
    </button>

    <button onclick="deletePage()">
        페이지 삭제
    </button>

    <button onclick="savePDF()">
        PDF로 저장
    </button>

</div>


<!-- =========================
     A4 페이지
========================= -->

<div
    id="pageArea"
    class="page-area">
</div>


<!-- 이미지 선택 -->

<input
    type="file"
    id="imageInput"
    accept="image/*"
    style="display:none;"
>


<script>

/* =====================================================
   문서 데이터
===================================================== */

var pages = [

    {
        image: "",

        author: "작가이름",

        title: "제목을 입력하세요",

        subtitle: "부제목을 입력하세요",

        content:
            "여기에 본문을 입력하세요."
    }

];

var currentPage = 0;

var imageTargetPage = null;


/* =====================================================
   페이지 그리기
===================================================== */

function renderPages() {

    var area =
        document.getElementById("pageArea");

    area.innerHTML = "";


    for (
        var i = 0;
        i < pages.length;
        i++
    ) {

        createPage(i, area);
    }


    updatePageNumber();

    fitA4();
}


/* =====================================================
   페이지 하나 만들기
===================================================== */

function createPage(index, area) {

    var data = pages[index];


    var page =
        document.createElement("section");

    page.className = "a4-page";


    if (index === currentPage) {

        page.classList.add("active");
    }


    page.dataset.index = index;


    /* 이미지 */

    var imageBox =
        document.createElement("div");

    imageBox.className =
        "image-box";


    imageBox.onclick = function() {

        imageTargetPage = index;

        document
            .getElementById("imageInput")
            .click();
    };


    if (data.image) {

        var image =
            document.createElement("img");

        image.src = data.image;

        imageBox.appendChild(image);

    } else {

        var text =
            document.createElement("span");

        text.textContent =
            "이미지를 추가하려면 클릭";

        imageBox.appendChild(text);
    }


    /* 작가 */

    var author =
        document.createElement("div");

    author.className = "author";

    author.contentEditable = "true";

    author.textContent =
        data.author;


    author.addEventListener(
        "input",
        function() {

            pages[index].author =
                this.innerText;
        }
    );


    /* 제목 */

    var title =
        document.createElement("div");

    title.className = "title";

    title.contentEditable = "true";

    title.textContent =
        data.title;


    title.addEventListener(
        "input",
        function() {

            pages[index].title =
                this.innerText;
        }
    );


    /* 부제목 */

    var subtitle =
        document.createElement("div");

    subtitle.className =
        "subtitle";

    subtitle.contentEditable =
        "true";

    subtitle.textContent =
        data.subtitle;


    subtitle.addEventListener(
        "input",
        function() {

            pages[index].subtitle =
                this.innerText;
        }
    );


    /* 본문 */

    var content =
        document.createElement("div");

    content.className =
        "content";

    content.contentEditable =
        "true";

    content.textContent =
        data.content;


    content.addEventListener(
        "input",
        function() {

            pages[index].content =
                this.innerText;
        }
    );


    page.appendChild(imageBox);

    page.appendChild(author);

    page.appendChild(title);

    page.appendChild(subtitle);

    page.appendChild(content);


    area.appendChild(page);
}


/* =====================================================
   페이지 번호
===================================================== */

function updatePageNumber() {

    document
        .getElementById("pageNumber")
        .textContent =
        (currentPage + 1)
        + " / "
        + pages.length;
}


/* =====================================================
   이전 페이지
===================================================== */

function previousPage() {

    if (currentPage <= 0) {

        return;
    }


    currentPage--;

    renderPages();
}


/* =====================================================
   다음 페이지
===================================================== */

function nextPage() {

    if (
        currentPage >=
        pages.length - 1
    ) {

        return;
    }


    currentPage++;

    renderPages();
}


/* =====================================================
   페이지 추가
===================================================== */

function addPage() {

    pages.push({

        image: "",

        author: "",

        title: "",

        subtitle: "",

        content: ""
    });


    currentPage =
        pages.length - 1;


    renderPages();
}


/* =====================================================
   페이지 삭제
===================================================== */

function deletePage() {

    if (pages.length === 1) {

        alert(
            "페이지가 하나뿐이라 삭제할 수 없습니다."
        );

        return;
    }


    var answer =
        confirm(
            "현재 페이지를 삭제할까요?"
        );


    if (!answer) {

        return;
    }


    pages.splice(
        currentPage,
        1
    );


    if (
        currentPage >=
        pages.length
    ) {

        currentPage =
            pages.length - 1;
    }


    renderPages();
}


/* =====================================================
   이미지 업로드
===================================================== */

document
    .getElementById("imageInput")
    .addEventListener(
        "change",
        function(event) {

            var file =
                event.target.files[0];


            if (!file) {

                return;
            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                alert(
                    "이미지 파일만 넣을 수 있습니다."
                );

                return;
            }


            var reader =
                new FileReader();


            reader.onload =
                function(e) {

                    if (
                        imageTargetPage !== null
                    ) {

                        pages[
                            imageTargetPage
                        ].image =
                            e.target.result;


                        currentPage =
                            imageTargetPage;


                        renderPages();
                    }
                };


            reader.readAsDataURL(file);


            event.target.value = "";
        }
    );


/* =====================================================
   ★ PDF 저장
===================================================== */

function savePDF() {

    /*
       현재 입력 중인 내용을
       데이터에 다시 반영
    */

    var pageElements =
        document.querySelectorAll(
            ".a4-page"
        );


    for (
        var i = 0;
        i < pageElements.length;
        i++
    ) {

        var page =
            pageElements[i];


        var author =
            page.querySelector(
                ".author"
            );

        var title =
            page.querySelector(
                ".title"
            );

        var subtitle =
            page.querySelector(
                ".subtitle"
            );

        var content =
            page.querySelector(
                ".content"
            );


        pages[i].author =
            author.innerText;

        pages[i].title =
            title.innerText;

        pages[i].subtitle =
            subtitle.innerText;

        pages[i].content =
            content.innerText;
    }


    /*
       모든 페이지를 인쇄 대상으로
       잠시 표시한다.
    */

    var pagesBefore =
        document.querySelectorAll(
            ".a4-page"
        );


    for (
        var j = 0;
        j < pagesBefore.length;
        j++
    ) {

        pagesBefore[j].classList.add(
            "active"
        );
    }


    /*
       브라우저의 PDF 저장 화면
    */

    setTimeout(
        function() {

            window.print();

        },
        100
    );
}


/* =====================================================
   모바일에서 A4 비율 유지
===================================================== */

function fitA4() {

    var page =
        document.querySelector(
            ".a4-page"
        );


    if (!page) {

        return;
    }


    if (
        window.innerWidth <= 850
    ) {

        var availableWidth =
            window.innerWidth - 20;


        var a4Width =
            page.offsetWidth;


        var scale =
            availableWidth /
            a4Width;


        if (scale > 1) {

            scale = 1;
        }


        page.style.transform =
            "scale(" + scale + ")";


        page.style.transformOrigin =
            "top center";


        page.style.marginBottom =
            "-" +
            (
                page.offsetHeight
                * (1 - scale)
            )
            + "px";

    } else {

        page.style.transform =
            "none";

        page.style.marginBottom =
            "0";
    }
}


/* =====================================================
   시작
===================================================== */

renderPages();


window.addEventListener(
    "resize",
    fitA4
);

</script>

</body>
</html>
