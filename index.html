<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PairMaker - 최종 완성 템플릿</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #334155;
            font-family: 'Pretendard', sans-serif;
            color: #1a202c;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px 60px 10px;
            overflow-x: hidden;
        }

        /* 상단 제어 패널 */
        .control-panel {
            background: #ffffff;
            padding: 10px 16px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 1000;
        }

        .control-panel button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            background-color: #4f46e5;
            color: white;
            transition: background 0.2s;
        }
        .control-panel button:hover { background-color: #4338ca; }
        .control-panel button:disabled { background-color: #cbd5e1; cursor: not-allowed; }

        .page-indicator {
            font-weight: 700;
            font-size: 14px;
            color: #334155;
            min-width: 50px;
            text-align: center;
        }

        .btn-print { background-color: #475569 !important; }
        .btn-print:hover { background-color: #334155 !important; }

        /* 문서 컨테이너 */
        .document-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* A4 규격 (794px × 1123px) */
        .a4-page {
            width: 794px;
            height: 1123px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 55px 65px;
            display: none;
            flex-direction: column;
            position: relative;
            border-radius: 4px;
        }

        .a4-page.active {
            display: flex;
        }

        /* 템플릿 내부 레이아웃 */
        .template-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        /* 콤팩트한 그림 칸 */
        .image-box {
            width: 100%;
            height: 135px; 
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-box span {
            color: #64748b;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            padding: 0 10px;
        }

        /* 작가이름, 커미주 */
        .author-info {
            text-align: right;
            font-size: 14px;
            color: #475569;
            font-weight: 600;
            outline: none;
            padding: 2px;
        }
        .author-info:focus {
            background: #f8fafc;
            border-radius: 4px;
        }

        /* 제목 및 부제목 (폰트 변경 및 두꺼운 글씨 적용) */
        .title-area {
            margin-bottom: 6px;
        }
        .main-title {
            font-family: 'Pretendard', sans-serif;
            font-size: 23px; /* 크기 살짝 키움 */
            font-weight: 800; /* 매우 두꺼운 글씨 */
            color: #0f172a;
            outline: none;
            margin-bottom: 3px;
        }
        .sub-title {
            font-family: 'Pretendard', sans-serif;
            font-size: 15px; /* 크기 살짝 키움 */
            font-weight: 600;
            color: #475569;
            outline: none;
        }
        .main-title:focus, .sub-title:focus {
            background: #f8fafc;
            border-radius: 4px;
        }

        /* 본문 내용 영역 (가독성 좋은 고운바탕 폰트 및 살짝 키운 글자 크기) */
        .content-area {
            font-family: 'Gowun Batang', serif;
            font-size: 15.5px; /* 요청하신 대로 살짝 키움 (+2 정도 체감) */
            line-height: 1.85;
            color: #1e293b;
            text-align: justify;
            word-break: break-all;
            white-space: pre-wrap;
            outline: none;
            flex-grow: 1;
            overflow-y: auto;
            padding: 6px;
            border-radius: 4px;
        }
        .content-area:focus {
            background: #f8fafc;
        }

        /* 인쇄 시 모든 페이지가 온전하게 인쇄되도록 설정 */
        @media print {
            body { background: none; padding: 0; }
            .control-panel { display: none !important; }
            .document-container { display: block !important; }
            .a4-page { 
                display: flex !important;
                box-shadow: none !important; 
                margin: 0 !important; 
                zoom: 1 !important;
                page-break-after: always; 
                width: 794px !important;
                height: 1123px !important;
                position: relative !important;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 제어 바 -->
    <div class="control-panel">
        <button id="prevBtn" onclick="changePage(-1)">‹ 이전</button>
        <span id="pageIndicator" class="page-indicator">1 / 1</span>
        <button id="nextBtn" onclick="changePage(1)">다음 ›</button>
        <button onclick="addPage()">＋ 추가</button>
        <button class="btn-print" onclick="previewAndPrint()">🖨 인쇄 / PDF 저장</button>
    </div>

    <!-- 문서 컨테이너 -->
    <div id="documentContainer" class="document-container"></div>

    <input type="file" id="imageSelector" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">

    <script>
        let pagesData = JSON.parse(localStorage.getItem('pairmaker_pages')) || [
            {
                image: '',
                author: '작가이름, 커미주',
                title: '제목을 입력하세요',
                subtitle: '부제 및 상세 설명을 입력하세요',
                content: '글자 크기와 폰트가 보기 좋게 조정되었으며, 인쇄 버튼을 누르면 전체 페이지 미리보기 창이 뜨면서 깔끔하게 PDF나 종이로 저장할 수 있습니다.'
            }
        ];

        let currentPageIndex = 0;
        let activeImagePageIndex = null;

        function adjustA4Zoom() {
            const pages = document.querySelectorAll('.a4-page');
            const screenWidth = window.innerWidth - 20;
            
            pages.forEach(page => {
                if (screenWidth < 794) {
                    let zoomRatio = screenWidth / 794;
                    page.style.zoom = zoomRatio;
                } else {
                    page.style.zoom = '1';
                }
            });
        }

        function renderDocument() {
            const container = document.getElementById('documentContainer');
            container.innerHTML = '';

            let totalPages = pagesData.length;
            if (currentPageIndex >= totalPages) currentPageIndex = totalPages - 1;

            pagesData.forEach((pageData, index) => {
                let pageEl = createPageElement(index, pageData);
                if (index === currentPageIndex) {
                    pageEl.classList.add('active');
                }
                container.appendChild(pageEl);
            });

            document.getElementById('pageIndicator').innerText = `${currentPageIndex + 1} / ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPageIndex === 0;
            document.getElementById('nextBtn').disabled = currentPageIndex === totalPages - 1;

            adjustA4Zoom();
            saveData();
        }

        function createPageElement(index, data) {
            let pageDiv = document.createElement('div');
            pageDiv.className = 'a4-page';

            let headerDiv = document.createElement('div');
            headerDiv.className = 'template-header';

            let imgBox = document.createElement('div');
            imgBox.className = 'image-box';
            if (data.image) {
                let img = document.createElement('img');
                img.src = data.image;
                imgBox.appendChild(img);
            } else {
                let span = document.createElement('span');
                span.innerText = '사진 / 그림을 추가하려면 클릭하세요';
                imgBox.appendChild(span);
            }
            imgBox.onclick = () => {
                activeImagePageIndex = index;
                document.getElementById('imageSelector').click();
            };
            headerDiv.appendChild(imgBox);

            let authorDiv = document.createElement('div');
            authorDiv.className = 'author-info';
            authorDiv.contentEditable = true;
            authorDiv.innerText = data.author;
            authorDiv.oninput = (e) => {
                pagesData[index].author = e.target.innerText;
                saveData();
            };
            headerDiv.appendChild(authorDiv);

            let titleArea = document.createElement('div');
            titleArea.className = 'title-area';

            let titleInput = document.createElement('div');
            titleInput.className = 'main-title';
            titleInput.contentEditable = true;
            titleInput.innerText = data.title;
            titleInput.oninput = (e) => {
                pagesData[index].title = e.target.innerText;
                saveData();
            };

            let subTitleInput = document.createElement('div');
            subTitleInput.className = 'sub-title';
            subTitleInput.contentEditable = true;
            subTitleInput.innerText = data.subtitle;
            subTitleInput.oninput = (e) => {
                pagesData[index].subtitle = e.target.innerText;
                saveData();
            };

            titleArea.appendChild(titleInput);
            titleArea.appendChild(subTitleInput);
            headerDiv.appendChild(titleArea);

            pageDiv.appendChild(headerDiv);

            let contentDiv = document.createElement('div');
            contentDiv.className = 'content-area';
            contentDiv.contentEditable = true;
            contentDiv.innerText = data.content;
            contentDiv.oninput = (e) => {
                pagesData[index].content = e.target.innerText;
                saveData();
            };
            pageDiv.appendChild(contentDiv);

            return pageDiv;
        }

        // 인쇄 버튼 클릭 시 모든 페이지가 미리보기에 나타나도록 일시적으로 전부 표시 후 인쇄 창 호출
        function previewAndPrint() {
            const pages = document.querySelectorAll('.a4-page');
            pages.forEach(p => p.classList.add('active'));
            
            window.print();

            // 인쇄 창이 닫히거나 한 뒤 현재 페이지만 보이도록 원복
            setTimeout(() => {
                renderDocument();
            }, 500);
        }

        function changePage(direction) {
            let newIndex = currentPageIndex + direction;
            if (newIndex >= 0 && newIndex < pagesData.length) {
                currentPageIndex = newIndex;
                renderDocument();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function handleImageUpload(event) {
            let file = event.target.files[0];
            if (file && activeImagePageIndex !== null) {
                let reader = new FileReader();
                reader.onload = (e) => {
                    pagesData[activeImagePageIndex].image = e.target.result;
                    renderDocument();
                };
                reader.readAsDataURL(file);
            }
        }

        function addPage() {
            pagesData.push({
                image: '',
                author: '작가이름, 커미주',
                title: '새로운 제목',
                subtitle: '부제목',
                content: '새로운 페이지의 내용입니다.'
            });
            currentPageIndex = pagesData.length - 1;
            renderDocument();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function saveData() {
            localStorage.setItem('pairmaker_pages', JSON.stringify(pagesData));
        }

        window.onload = () => {
            renderDocument();
        };

        window.onresize = () => {
            adjustA4Zoom();
        };
    </script>
</body>
</html>
