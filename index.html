<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PairMaker - 비율 유지 A4 템플릿</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Pretendard:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #334155;
            font-family: 'Pretendard', sans-serif;
            color: #1a202c;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px 60px 10px;
            overflow-x: hidden;
        }

        /* 상단 제어 패널 (화면 상단 고정) */
        .control-panel {
            background: #ffffff;
            padding: 10px 16px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 1000;
        }

        .control-panel button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            background-color: #4f46e5;
            color: white;
            transition: background 0.2s;
        }
        .control-panel button:hover { background-color: #4338ca; }
        .control-panel button:disabled { background-color: #cbd5e1; cursor: not-allowed; }

        .page-indicator {
            font-weight: 700;
            font-size: 14px;
            color: #334155;
            min-width: 50px;
            text-align: center;
        }

        .btn-print { background-color: #475569 !important; }
        .btn-print:hover { background-color: #334155 !important; }

        /* 문서 뷰포트 wrapper (A4 비율 축소 마법의 영역) */
        .page-viewport {
            width: 794px;
            height: 1123px;
            position: relative;
            display: none; /* 기본 숨김, 활성화된 페이지만 표시 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-radius: 4px;
            background: #ffffff;
        }

        .page-viewport.active {
            display: block;
        }

        /* [핵심] 온전한 A4 규격 (794px × 1123px) 고정 및 내부 요소 배치 */
        .a4-page {
            width: 794px;
            height: 1123px;
            background: #ffffff;
            padding: 55px 65px;
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 4px;
        }

        /* 템플릿 내부 레이아웃 */
        .template-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        /* 세로로 길지 않고 콤팩트한 그림 칸 */
        .image-box {
            width: 100%;
            height: 135px; 
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-box span {
            color: #64748b;
            font-weight: 600;
            font-size: 13px;
            text-align: center;
            padding: 0 10px;
        }

        /* 작가이름, 커미주 */
        .author-info {
            text-align: right;
            font-size: 13px;
            color: #475569;
            font-weight: 600;
            outline: none;
            padding: 2px;
        }
        .author-info:focus {
            background: #f8fafc;
            border-radius: 4px;
        }

        /* 제목 및 부제목 */
        .title-area {
            margin-bottom: 5px;
        }
        .main-title {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            outline: none;
            margin-bottom: 2px;
        }
        .sub-title {
            font-size: 13px;
            color: #475569;
            outline: none;
        }
        .main-title:focus, .sub-title:focus {
            background: #f8fafc;
            border-radius: 4px;
        }

        /* 본문 내용 영역 (글이 많이 들어가도록 최적화된 명조체 공간) */
        .content-area {
            font-family: 'Noto Serif KR', serif;
            font-size: 13.5px;
            line-height: 1.8;
            color: #1e293b;
            text-align: justify;
            word-break: break-all;
            white-space: pre-wrap;
            outline: none;
            flex-grow: 1;
            overflow-y: auto;
            padding: 6px;
            border-radius: 4px;
        }
        .content-area:focus {
            background: #f8fafc;
        }

        /* 모바일 등 화면이 작아질 때 A4 비율을 유지한 채 쏙 들어가도록 자동 축소하는 스크립트 대응 스타일 */
        @media print {
            body { background: none; padding: 0; }
            .control-panel { display: none; }
            .page-viewport {
                display: block !important;
                box-shadow: none;
                transform: none !important;
                margin: 0;
                page-break-after: always;
            }
            .a4-page {
                position: relative;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 제어 바 (페이지 전환 및 추가 기능 모음) -->
    <div class="control-panel">
        <button id="prevBtn" onclick="changePage(-1)">‹ 이전</button>
        <span id="pageIndicator" class="page-indicator">1 / 1</span>
        <button id="nextBtn" onclick="changePage(1)">다음 ›</button>
        <button onclick="addPage()">＋ 추가</button>
        <button class="btn-print" onclick="window.print()">🖨 인쇄</button>
    </div>

    <!-- A4 문서 뷰포트 (비율 유지 축소가 적용되는 자리) -->
    <div id="pageViewport" class="page-viewport">
        <div id="documentContainer" style="width: 100%; height: 100%;"></div>
    </div>

    <input type="file" id="imageSelector" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">

    <script>
        let pagesData = JSON.parse(localStorage.getItem('pairmaker_pages')) || [
            {
                image: '',
                author: '작가이름, 커미주',
                title: '제목을 입력하세요',
                subtitle: '부제 및 상세 설명을 입력하세요',
                content: '온전한 A4 비율(794×1123)이 철저히 유지되면서도, 스마트폰 화면 크기에 맞춰 비율 그대로 쏙 축소되어 절대 잘리지 않습니다.'
            }
        ];

        let currentPageIndex = 0;
        let activeImagePageIndex = null;

        // 화면 크기에 맞춰 A4 용지(794px)를 비율 유지하며 자동 축소하는 함수
        function adjustA4Scale() {
            const viewport = document.getElementById('pageViewport');
            const screenWidth = window.innerWidth - 20; // 좌우 여백 고려
            
            if (screenWidth < 794) {
                let scale = screenWidth / 794;
                viewport.style.transform = `scale(${scale})`;
                viewport.style.transformOrigin = 'top center';
                // 축소된 만큼 부모 컨테이너의 높이도 비례해서 잡아줌
                viewport.style.marginBottom = `${(1123 * (1 - scale))}px`;
            } else {
                viewport.style.transform = 'none';
                viewport.style.marginBottom = '0px';
            }
        }

        function renderDocument() {
            const container = document.getElementById('documentContainer');
            container.innerHTML = '';

            let totalPages = pagesData.length;
            if (currentPageIndex >= totalPages) currentPageIndex = totalPages - 1;

            let pageData = pagesData[currentPageIndex];
            let pageEl = createPageElement(currentPageIndex, pageData);
            container.appendChild(pageEl);

            // 뷰포트 활성화
            document.getElementById('pageViewport').classList.add('active');

            // 상단 컨트롤러 상태 업데이트
            document.getElementById('pageIndicator').innerText = `${currentPageIndex + 1} / ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPageIndex === 0;
            document.getElementById('nextBtn').disabled = currentPageIndex === totalPages - 1;

            adjustA4Scale();
            saveData();
        }

        function createPageElement(index, data) {
            let pageDiv = document.createElement('div');
            pageDiv.className = 'a4-page';

            let headerDiv = document.createElement('div');
            headerDiv.className = 'template-header';

            let imgBox = document.createElement('div');
            imgBox.className = 'image-box';
            if (data.image) {
                let img = document.createElement('img');
                img.src = data.image;
                imgBox.appendChild(img);
            } else {
                let span = document.createElement('span');
                span.innerText = '사진 / 그림을 추가하려면 클릭하세요';
                imgBox.appendChild(span);
            }
            imgBox.onclick = () => {
                activeImagePageIndex = index;
                document.getElementById('imageSelector').click();
            };
            headerDiv.appendChild(imgBox);

            let authorDiv = document.createElement('div');
            authorDiv.className = 'author-info';
            authorDiv.contentEditable = true;
            authorDiv.innerText = data.author;
            authorDiv.oninput = (e) => {
                pagesData[index].author = e.target.innerText;
                saveData();
            };
            headerDiv.appendChild(authorDiv);

            let titleArea = document.createElement('div');
            titleArea.className = 'title-area';

            let titleInput = document.createElement('div');
            titleInput.className = 'main-title';
            titleInput.contentEditable = true;
            titleInput.innerText = data.title;
            titleInput.oninput = (e) => {
                pagesData[index].title = e.target.innerText;
                saveData();
            };

            let subTitleInput = document.createElement('div');
            subTitleInput.className = 'sub-title';
            subTitleInput.contentEditable = true;
            subTitleInput.innerText = data.subtitle;
            subTitleInput.oninput = (e) => {
                pagesData[index].subtitle = e.target.innerText;
                saveData();
            };

            titleArea.appendChild(titleInput);
            titleArea.appendChild(subTitleInput);
            headerDiv.appendChild(titleArea);

            pageDiv.appendChild(headerDiv);

            let contentDiv = document.createElement('div');
            contentDiv.className = 'content-area';
            contentDiv.contentEditable = true;
            contentDiv.innerText = data.content;
            contentDiv.oninput = (e) => {
                pagesData[index].content = e.target.innerText;
                saveData();
            };
            pageDiv.appendChild(contentDiv);

            return pageDiv;
        }

        function changePage(direction) {
            let newIndex = currentPageIndex + direction;
            if (newIndex >= 0 && newIndex < pagesData.length) {
                currentPageIndex = newIndex;
                renderDocument();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function handleImageUpload(event) {
            let file = event.target.files[0];
            if (file && activeImagePageIndex !== null) {
                let reader = new FileReader();
                reader.onload = (e) => {
                    pagesData[activeImagePageIndex].image = e.target.result;
                    renderDocument();
                };
                reader.readAsDataURL(file);
            }
        }

        function addPage() {
            pagesData.push({
                image: '',
                author: '작가이름, 커미주',
                title: '새로운 제목',
                subtitle: '부제목',
                content: '새로운 페이지의 내용입니다.'
            });
            currentPageIndex = pagesData.length - 1;
            renderDocument();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function saveData() {
            localStorage.setItem('pairmaker_pages', JSON.stringify(pagesData));
        }

        window.onload = () => {
            renderDocument();
        };

        window.onresize = () => {
            adjustA4Scale();
        };
    </script>
</body>
</html>
