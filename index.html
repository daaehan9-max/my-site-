<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PairMaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #dcdcdc;
            font-family: 'Pretendard', sans-serif;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px 60px 10px;
            overflow-x: hidden;
        }

        .control-panel {
            background: #ffffff;
            border: 1px solid #999999;
            padding: 10px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 1000;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-panel button {
            padding: 8px 12px;
            border: 1px solid #222222;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            background-color: #ffffff;
            color: #111111;
        }
        .control-panel button:hover { background-color: #111111; color: #ffffff; }
        .control-panel button:disabled { border-color: #cccccc; background-color: #f0f0f0; color: #aaaaaa; cursor: not-allowed; }

        .page-indicator {
            font-weight: 700;
            font-size: 14px;
            color: #222222;
            min-width: 45px;
            text-align: center;
        }

        .btn-save-img { background-color: #111111 !important; color: #ffffff !important; }
        .btn-delete-page { border-color: #c93b3b !important; color: #c93b3b !important; }

        /* 저장 선택 모달 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-box {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 280px;
            text-align: center;
        }
        .modal-box h3 { font-size: 16px; margin-bottom: 4px; color: #111; }
        .modal-box button {
            padding: 12px;
            border: 1px solid #222;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            background: #fff;
            color: #111;
        }
        .modal-box button:hover { background: #111; color: #fff; }
        .modal-box .btn-cancel { border-color: #ccc; color: #666; background: #f9f9f9; }
