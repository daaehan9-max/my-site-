<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A4 글 편집기</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
    background: #e5e5e5;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;
    min-height: 100vh;
}

/* =========================
   상단 메뉴
========================= */

.toolbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    width: 100%;
    padding: 10px;

    background: rgba(255,255,255,0.96);
    border-bottom: 1px solid #ccc;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
}

.toolbar button {
    border: 1px solid #aaa;
    background: white;
    color: #222;

    border-radius: 7px;
    padding: 8px 13px;

    font-size: 13px;
    cursor: pointer;
}

.toolbar button:hover {
    background: #f1f1f1;
}

.toolbar button:active {
    transform: translateY(1px);
}

.page-number {
    min-width: 60px;
    text-align: center;
    font-size: 13px;
    color: #555;
}

/* =========================
   페이지 영역
========================= */

.page-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 30px 15px 80px;
}

/* A4 */
.a4-page {
    width: 794px;
    height: 1123px;

    background: #fff;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.15);

    position: relative;

    padding: 65px 70px;

    display: none;
    flex-direction: column;

    overflow: hidden;
}

.a4-page.active {
    display: flex;
}

/* =========================
   이미지
========================= */

.image-area {
    width: 100%;
    height: 180px;

    border: 1.5px dashed #aaa;
    background: #fafafa;

    border-radius: 5px;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;

    overflow: hidden;

    margin-bottom: 22px;

    flex-shrink: 0;
}

.image-area:hover {
    background: #f3f3f3;
}

.image-area span {
    color: #999;
    font-size: 13px;
}

.image-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* =========================
   작가
========================= */

.author {
    font-family:
        "Pretendard",
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    font-size: 12px;
    color: #888;

    margin-bottom: 12px;

    outline: none;

    flex-shrink: 0;
}

/* =========================
   제목
========================= */

.title {
    font-family:
        "Pretendard",
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    font-size: 28px;
    font-weight: 700;

    line-height: 1.35;

    margin-bottom: 8px;

    outline: none;

    flex-shrink: 0;
}

/* =========================
   부제목
========================= */

.subtitle {
    font-family:
        "Pretendard",
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    font-size: 16px;
    font-weight: 500;

    color: #777;

    line-height: 1.5;

    margin-bottom: 24px;

    outline: none;

    flex-shrink: 0;
}

/* =========================
   본문
========================= */

.content {
    font-family:
        "Noto Serif KR",
        "Batang",
        "AppleMyungjo",
        "Gowun Batang",
        serif;

    font-size: 16px;
    line-height: 1.9;

    color: #222;

    outline: none;

    white-space: pre-wrap;
    word-break: break-word;

    overflow: hidden;

    flex: 1;

    min-height: 0;
}

/* 편집 중인 곳 */
[contenteditable="true"]:focus {
    outline: none;
}

/* =========================
   모바일
========================= */

@media screen and (max-width: 850px) {

    .page-wrapper {
        padding: 20px 0 50px;
        overflow: hidden;
    }

    .a4-page {
        transform-origin: top center;
    }

}

/* =========================
   인쇄
========================= */

@media print {

    body {
        background: white;
    }

    .toolbar {
        display: none;
    }

    .page-wrapper {
        padding: 0;
        display: block;
    }

    .a4-page {
        display: flex !important;

        width: 210mm;
        height: 297mm;

        box-shadow: none;

        page-break-after: always;

        padding: 17mm 18mm;
    }
}
</style>
</head>


<body>

<!-- =========================
     상단 메뉴
========================= -->

<div class="toolbar">

    <button onclick="previousPage()">‹ 이전</button>

    <span id="pageNumber" class="page-number">
        1 / 1
    </span>

    <button onclick="nextPage()">다음 ›</button>

    <button onclick="addPage()">＋ 페이지 추가</button>

    <button onclick="deletePage()">페이지 삭제</button>

    <button onclick="saveDocument()">저장</button>

    <button onclick="window.print()">PDF 저장</button>

</div>


<!-- =========================
     페이지
========================= -->

<div id="pageWrapper" class="page-wrapper"></div>


<!-- 이미지 선택 -->
<input
    type="file"
    id="imageInput"
    accept="image/*"
    style="display:none;"
>


<script>

/* =====================================================
   기본 데이터
===================================================== */

var pages = [
    {
        image: "",
        author: "작가이름",
        title: "제목을 입력하세요",
        subtitle: "부제목을 입력하세요",
        content: "여기에 본문을 입력하세요."
    }
];

var currentPage = 0;

var imageTargetPage = null;


/* =====================================================
   페이지 표시
===================================================== */

function renderPages() {

    var wrapper = document.getElementById("pageWrapper");

    wrapper.innerHTML = "";

    for (var i = 0; i < pages.length; i++) {

        var page = document.createElement("div");

        page.className = "a4-page";

        if (i === currentPage) {
            page.className += " active";
        }

        page.setAttribute("data-page", i);


        /* 이미지 */

        var imageArea = document.createElement("div");

        imageArea.className = "image-area";

        imageArea.onclick = function() {

            var pageIndex = Number(
                this.parentElement.getAttribute("data-page")
            );

            imageTargetPage = pageIndex;

            document.getElementById("imageInput").click();
        };


        if (pages[i].image) {

            var image = document.createElement("img");

            image.src = pages[i].image;

            imageArea.appendChild(image);

        } else {

            var imageText = document.createElement("span");

            imageText.innerText = "이미지를 추가하려면 클릭";

            imageArea.appendChild(imageText);
        }


        /* 작가 */

        var author = document.createElement("div");

        author.className = "author";

        author.contentEditable = "true";

        author.innerText = pages[i].author;

        author.addEventListener("input", function() {

            var index = Number(
                this.parentElement.getAttribute("data-page")
            );

            pages[index].author = this.innerText;

        });


        /* 제목 */

        var title = document.createElement("div");

        title.className = "title";

        title.contentEditable = "true";

        title.innerText = pages[i].title;

        title.addEventListener("input", function() {

            var index = Number(
                this.parentElement.getAttribute("data-page")
            );

            pages[index].title = this.innerText;

        });


        /* 부제목 */

        var subtitle = document.createElement("div");

        subtitle.className = "subtitle";

        subtitle.contentEditable = "true";

        subtitle.innerText = pages[i].subtitle;

        subtitle.addEventListener("input", function() {

            var index = Number(
                this.parentElement.getAttribute("data-page")
            );

            pages[index].subtitle = this.innerText;

        });


        /* 본문 */

        var content = document.createElement("div");

        content.className = "content";

        content.contentEditable = "true";

        content.innerText = pages[i].content;

        content.addEventListener("input", function() {

            var index = Number(
                this.parentElement.getAttribute("data-page")
            );

            pages[index].content = this.innerText;

            checkOverflow(index);

        });


        page.appendChild(imageArea);
        page.appendChild(author);
        page.appendChild(title);
        page.appendChild(subtitle);
        page.appendChild(content);

        wrapper.appendChild(page);
    }


    updatePageNumber();

    resizePage();
}


/* =====================================================
   페이지 번호
===================================================== */

function updatePageNumber() {

    document.getElementById("pageNumber").innerText =
        (currentPage + 1) + " / " + pages.length;
}


/* =====================================================
   이전 페이지
===================================================== */

function previousPage() {

    if (currentPage > 0) {

        currentPage--;

        renderPages();
    }
}


/* =====================================================
   다음 페이지
===================================================== */

function nextPage() {

    if (currentPage < pages.length - 1) {

        currentPage++;

        renderPages();
    }
}


/* =====================================================
   페이지 추가
===================================================== */

function addPage() {

    pages.push({
        image: "",
        author: "",
        title: "",
        subtitle: "",
        content: ""
    });

    currentPage = pages.length - 1;

    renderPages();
}


/* =====================================================
   페이지 삭제
===================================================== */

function deletePage() {

    if (pages.length === 1) {

        alert("페이지가 하나뿐이라 삭제할 수 없습니다.");

        return;
    }


    var answer = confirm(
        "현재 페이지를 삭제할까요?"
    );

    if (!answer) {
        return;
    }


    pages.splice(currentPage, 1);


    if (currentPage >= pages.length) {

        currentPage = pages.length - 1;
    }


    renderPages();
}


/* =====================================================
   이미지 업로드
===================================================== */

document.getElementById("imageInput").addEventListener(
    "change",
    function(event) {

        var file = event.target.files[0];

        if (!file) {
            return;
        }


        if (!file.type.startsWith("image/")) {

            alert("이미지 파일만 넣을 수 있습니다.");

            return;
        }


        var reader = new FileReader();


        reader.onload = function(e) {

            if (
                imageTargetPage !== null &&
                pages[imageTargetPage]
            ) {

                pages[imageTargetPage].image =
                    e.target.result;

                currentPage = imageTargetPage;

                renderPages();
            }
        };


        reader.readAsDataURL(file);


        /* 같은 이미지를 다시 선택할 수 있도록 초기화 */

        event.target.value = "";
    }
);


/* =====================================================
   저장
===================================================== */

function saveDocument() {

    try {

        localStorage.setItem(
            "a4_editor_pages",
            JSON.stringify(pages)
        );

        localStorage.setItem(
            "a4_editor_current_page",
            String(currentPage)
        );

        alert("저장되었습니다.");

    } catch (error) {

        alert(
            "저장하지 못했습니다.\n\n" +
            "브라우저 저장 공간이 부족할 수 있습니다."
        );
    }
}


/* =====================================================
   자동 불러오기
===================================================== */

function loadDocument() {

    try {

        var savedPages =
            localStorage.getItem("a4_editor_pages");

        var savedPage =
            localStorage.getItem("a4_editor_current_page");


        if (savedPages) {

            var parsed =
                JSON.parse(savedPages);


            if (
                Array.isArray(parsed) &&
                parsed.length > 0
            ) {

                pages = parsed;
            }
        }


        if (savedPage !== null) {

            var number =
                parseInt(savedPage, 10);


            if (
                !isNaN(number) &&
                number >= 0 &&
                number < pages.length
            ) {

                currentPage = number;
            }
        }

    } catch (error) {

        console.log(
            "저장된 문서를 불러오지 못했습니다."
        );
    }
}


/* =====================================================
   글이 페이지 밖으로 넘치는지 확인
===================================================== */

function checkOverflow(index) {

    var page =
        document.querySelector(
            '.a4-page[data-page="' + index + '"]'
        );


    if (!page) {
        return;
    }


    var content =
        page.querySelector(".content");


    if (!content) {
        return;
    }


    /*
       본문이 페이지 높이를 넘으면
       마지막 문장 일부를 다음 페이지로 이동
    */

    if (content.scrollHeight > content.clientHeight) {

        var text = pages[index].content;

        var splitPoint =
            findSplitPoint(content);


        if (
            splitPoint > 0 &&
            splitPoint < text.length
        ) {

            var firstText =
                text.substring(0, splitPoint);

            var secondText =
                text.substring(splitPoint);


            pages[index].content =
                firstText.trim();


            if (!pages[index + 1]) {

                pages.push({
                    image: "",
                    author: "",
                    title: "",
                    subtitle: "",
                    content: ""
                });
            }


            pages[index + 1].content =
                secondText.trim();


            renderPages();
        }
    }
}


/* =====================================================
   적당한 위치에서 본문 자르기
===================================================== */

function findSplitPoint(element) {

    var text = element.innerText;

    if (text.length < 50) {
        return text.length;
    }


    var estimated =
        Math.floor(text.length * 0.92);


    var newline =
        text.lastIndexOf("\n", estimated);


    if (
        newline > text.length * 0.5
    ) {

        return newline;
    }


    var space =
        text.lastIndexOf(" ", estimated);


    if (
        space > text.length * 0.5
    ) {

        return space;
    }


    return estimated;
}


/* =====================================================
   모바일에서 A4 크기 자동 축소
===================================================== */

function resizePage() {

    var page =
        document.querySelector(".a4-page");

    if (!page) {
        return;
    }


    if (window.innerWidth < 850) {

        var available =
            window.innerWidth - 20;

        var scale =
            available / 794;


        if (scale > 1) {
            scale = 1;
        }


        page.style.transform =
            "scale(" + scale + ")";


        page.style.marginBottom =
            "-" + (1123 * (1 - scale)) + "px";

    } else {

        page.style.transform = "none";

        page.style.marginBottom = "0";
    }
}


/* =====================================================
   시작
===================================================== */

loadDocument();

renderPages();

window.addEventListener(
    "resize",
    resizePage
);

</script>

</body>
</html>
