<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A4 문서 편집기</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #e5e5e5;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;
    min-height: 100vh;
}

/* 상단 버튼 */

.toolbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    width: 100%;
    padding: 10px;

    background: rgba(255,255,255,0.97);
    border-bottom: 1px solid #ccc;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
}

.toolbar button {
    border: 1px solid #aaa;
    background: #fff;
    color: #222;

    border-radius: 7px;
    padding: 8px 13px;

    font-size: 13px;
    cursor: pointer;
}

.toolbar button:hover {
    background: #f1f1f1;
}

.page-number {
    min-width: 60px;
    text-align: center;
    font-size: 13px;
    color: #555;
}

/* 페이지 */

.page-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 30px 15px 80px;
}

.a4-page {
    width: 794px;
    height: 1123px;

    background: white;

    box-shadow: 0 5px 25px rgba(0,0,0,0.15);

    position: relative;

    padding: 65px 70px;

    display: none;
    flex-direction: column;

    overflow: hidden;
}

.a4-page.active {
    display: flex;
}

/* 이미지 */

.image-area {
    width: 100%;
    height: 180px;

    border: 1.5px dashed #aaa;
    background: #fafafa;

    border-radius: 5px;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;

    overflow: hidden;

    margin-bottom: 22px;

    flex-shrink: 0;
}

.image-area:hover {
    background: #f3f3f3;
}

.image-area span {
    color: #999;
    font-size: 13px;
}

.image-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* 작가 */

.author {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    font-size: 12px;
    color: #888;

    margin-bottom: 12px;

    outline: none;

    flex-shrink: 0;
}

/* 제목 */

.title {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    font-size: 28px;
    font-weight: 700;

    line-height: 1.35;

    margin-bottom: 8px;

    outline: none;

    flex-shrink: 0;
}

/* 부제목 */

.subtitle {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    font-size: 16px;
    font-weight: 500;

    color: #777;

    line-height: 1.5;

    margin-bottom: 24px;

    outline: none;

    flex-shrink: 0;
}

/* 본문 */

.content {
    font-family:
        "Batang",
        "AppleMyungjo",
        "Gowun Batang",
        serif;

    font-size: 16px;
    line-height: 1.9;

    color: #222;

    outline: none;

    white-space: pre-wrap;
    word-break: break-word;

    overflow: hidden;

    flex: 1;

    min-height: 0;
}

[contenteditable="true"]:focus {
    outline: none;
}

/* 모바일 */

@media screen and (max-width: 850px) {

    .page-wrapper {
        padding: 20px 0 50px;
        overflow: hidden;
    }

}

/* 인쇄 */

@media print {

    body {
        background: white;
    }

    .toolbar {
        display: none;
    }

    .page-wrapper {
        padding: 0;
        display: block;
    }

    .a4-page {
        display: flex !important;

        width: 210mm;
        height: 297mm;

        box-shadow: none;

        page-break-after: always;

        padding: 17mm 18mm;
    }
}
</style>
</head>

<body>

<div class="toolbar">

    <button onclick="previousPage()">‹ 이전</button>

    <span id="pageNumber" class="page-number">
        1 / 1
    </span>

    <button onclick="nextPage()">다음 ›</button>

    <button onclick="addPage()">＋ 페이지 추가</button>

    <button onclick="deletePage()">페이지 삭제</button>

    <button onclick="saveDocument()">💾 저장</button>

    <button onclick="window.print()">PDF 저장</button>

</div>

<div id="pageWrapper" class="page-wrapper"></div>

<input
    type="file"
    id="imageInput"
    accept="image/*"
    style="display:none;"
>

<script>

/* =====================================================
   문서 데이터
===================================================== */

var pages = [
    {
        image: "",
        author: "작가이름",
        title: "제목을 입력하세요",
        subtitle: "부제목을 입력하세요",
        content: "여기에 본문을 입력하세요."
    }
];

var currentPage = 0;
var imageTargetPage = null;


/* =====================================================
   페이지 렌더링
===================================================== */

function renderPages() {

    var wrapper = document.getElementById("pageWrapper");

    wrapper.innerHTML = "";

    for (var i = 0; i < pages.length; i++) {

        var page = document.createElement("div");

        page.className = "a4-page";

        if (i === currentPage) {
            page.classList.add("active");
        }

        page.setAttribute("data-page", i);


        /* 이미지 */

        var imageArea = document.createElement("div");

        imageArea.className = "image-area";

        imageArea.onclick = function() {

            var index = Number(
                this.parentElement.getAttribute("data-page")
            );

            imageTargetPage = index;

            document.getElementById("imageInput").click();
        };


        if (pages[i].image) {

            var img = document.createElement("img");

            img.src = pages[i].image;

            imageArea.appendChild(img);

        } else {

            var imageText = document.createElement("span");

            imageText.textContent =
                "이미지를 추가하려면 클릭";

            imageArea.appendChild(imageText);
        }


        /* 작가 */

        var author = document.createElement("div");

        author.className = "author";

        author.contentEditable = "true";

        author.textContent = pages[i].author;

        author.addEventListener("input", function() {

            var index = Number(
                this.parentElement.getAttribute("data-page")
            );

            pages[index].author = this.innerText;

        });


        /* 제목 */

        var title = document.createElement("div");

        title.className = "title";

        title.contentEditable = "true";

        title.textContent = pages[i].title;

        title.addEventListener("input", function() {

            var index = Number(
                this.parentElement.getAttribute("data-page")
            );

            pages[index].title = this.innerText;

        });


        /* 부제목 */

        var subtitle = document.createElement("div");

        subtitle.className = "subtitle";

        subtitle.contentEditable = "true";

        subtitle.textContent = pages[i].subtitle;

        subtitle.addEventListener("input", function() {

            var index = Number(
                this.parentElement.getAttribute("data-page")
            );

            pages[index].subtitle = this.innerText;

        });


        /* 본문 */

        var content = document.createElement("div");

        content.className = "content";

        content.contentEditable = "true";

        content.textContent = pages[i].content;

        content.addEventListener("input", function() {

            var index = Number(
                this.parentElement.getAttribute("data-page")
            );

            pages[index].content = this.innerText;

        });


        page.appendChild(imageArea);
        page.appendChild(author);
        page.appendChild(title);
        page.appendChild(subtitle);
        page.appendChild(content);

        wrapper.appendChild(page);
    }

    updatePageNumber();
    resizePage();
}


/* =====================================================
   페이지 번호
===================================================== */

function updatePageNumber() {

    document.getElementById("pageNumber").textContent =
        (currentPage + 1) + " / " + pages.length;
}


/* =====================================================
   이전
===================================================== */

function previousPage() {

    if (currentPage > 0) {

        currentPage--;

        renderPages();
    }
}


/* =====================================================
   다음
===================================================== */

function nextPage() {

    if (currentPage < pages.length - 1) {

        currentPage++;

        renderPages();
    }
}


/* =====================================================
   페이지 추가
===================================================== */

function addPage() {

    pages.push({
        image: "",
        author: "",
        title: "",
        subtitle: "",
        content: ""
    });

    currentPage = pages.length - 1;

    renderPages();
}


/* =====================================================
   페이지 삭제
===================================================== */

function deletePage() {

    if (pages.length <= 1) {

        alert("페이지가 하나뿐이라 삭제할 수 없습니다.");

        return;
    }

    if (!confirm("현재 페이지를 삭제할까요?")) {
        return;
    }

    pages.splice(currentPage, 1);

    if (currentPage >= pages.length) {
        currentPage = pages.length - 1;
    }

    renderPages();
}


/* =====================================================
   이미지 추가
===================================================== */

document
.getElementById("imageInput")
.addEventListener("change", function(event) {

    var file = event.target.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {

        alert("이미지 파일만 넣을 수 있습니다.");

        return;
    }

    var reader = new FileReader();

    reader.onload = function(e) {

        if (
            imageTargetPage !== null &&
            pages[imageTargetPage]
        ) {

            pages[imageTargetPage].image =
                e.target.result;

            currentPage = imageTargetPage;

            renderPages();
        }
    };

    reader.readAsDataURL(file);

    event.target.value = "";
});


/* =====================================================
   ★ 진짜 파일로 저장
===================================================== */

function saveDocument() {

    /* 현재 입력 내용 확실하게 반영 */

    var pageElements =
        document.querySelectorAll(".a4-page");

    for (var i = 0; i < pageElements.length; i++) {

        var page = pageElements[i];

        var author =
            page.querySelector(".author");

        var title =
            page.querySelector(".title");

        var subtitle =
            page.querySelector(".subtitle");

        var content =
            page.querySelector(".content");


        if (pages[i]) {

            pages[i].author =
                author.innerText;

            pages[i].title =
                title.innerText;

            pages[i].subtitle =
                subtitle.innerText;

            pages[i].content =
                content.innerText;
        }
    }


    /* 문서 HTML 생성 */

    var pagesHTML = "";


    for (var j = 0; j < pages.length; j++) {

        var p = pages[j];

        var imageHTML = "";

        if (p.image) {

            imageHTML =
                '<div class="image-area">' +
                '<img src="' + p.image + '">' +
                '</div>';

        } else {

            imageHTML =
                '<div class="image-area empty"></div>';
        }


        pagesHTML +=
            '<section class="page">' +

            imageHTML +

            '<div class="author">' +
            escapeHTML(p.author) +
            '</div>' +

            '<div class="title">' +
            escapeHTML(p.title) +
            '</div>' +

            '<div class="subtitle">' +
            escapeHTML(p.subtitle) +
            '</div>' +

            '<div class="content">' +
            escapeHTML(p.content)
                .replace(/\n/g, "<br>") +
            '</div>' +

            '</section>';
    }


    /* 저장되는 완성 HTML */

    var finalHTML = `<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>내 문서</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 0;
    background: #ddd;
    color: #222;
}

.page {
    width: 794px;
    height: 1123px;

    background: white;

    margin: 0 auto 30px;

    padding: 65px 70px;

    overflow: hidden;

    box-shadow: 0 5px 20px rgba(0,0,0,0.15);

    page-break-after: always;
}

.image-area {
    width: 100%;
    height: 180px;

    margin-bottom: 22px;

    border-radius: 5px;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

.image-area.empty {
    display: none;
}

.image-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.author {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    font-size: 12px;
    color: #888;

    margin-bottom: 12px;
}

.title {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    font-size: 28px;
    font-weight: 700;

    line-height: 1.35;

    margin-bottom: 8px;
}

.subtitle {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    font-size: 16px;

    color: #777;

    margin-bottom: 24px;
}

.content {
    font-family:
        "Batang",
        "AppleMyungjo",
        "Gowun Batang",
        serif;

    font-size: 16px;

    line-height: 1.9;
}

@media print {

    body {
        background: white;
        padding: 0;
    }

    .page {
        margin: 0;

        width: 210mm;
        height: 297mm;

        box-shadow: none;
    }
}

@media screen and (max-width: 850px) {

    body {
        overflow-x: hidden;
    }

    .page {
        transform-origin: top center;

        transform:
            scale(
                calc((100vw - 20px) / 794)
            );

        margin-bottom:
            calc(
                -1123px +
                (1123px * ((100vw - 20px) / 794))
            );
    }
}

</style>

</head>

<body>

${pagesHTML}

</body>
</html>`;


    /* Blob 생성 */

    var blob = new Blob(
        [finalHTML],
        {
            type: "text/html;charset=utf-8"
        }
    );


    /* 다운로드 */

    var url =
        URL.createObjectURL(blob);

    var link =
        document.createElement("a");

    link.href = url;

    link.download =
        "내_A4_문서.html";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    setTimeout(function() {

        URL.revokeObjectURL(url);

    }, 1000);


    alert(
        "저장되었습니다!\n\n" +
        "내_A4_문서.html 파일을 확인하세요."
    );
}


/* =====================================================
   HTML 특수문자 처리
===================================================== */

function escapeHTML(text) {

    if (!text) {
        return "";
    }

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   모바일 A4 크기
===================================================== */

function resizePage() {

    var page =
        document.querySelector(".a4-page");

    if (!page) {
        return;
    }

    if (window.innerWidth < 850) {

        var available =
            window.innerWidth - 20;

        var scale =
            available / 794;

        if (scale > 1) {
            scale = 1;
        }

        page.style.transform =
            "scale(" + scale + ")";

        page.style.marginBottom =
            "-" +
            (1123 * (1 - scale)) +
            "px";

    } else {

        page.style.transform = "none";

        page.style.marginBottom = "0";
    }
}


/* =====================================================
   시작
===================================================== */

renderPages();

window.addEventListener(
    "resize",
    resizePage
);

</script>

</body>
</html>
